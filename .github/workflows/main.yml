44|44|
45|45|    - name: Setup Environment
46|46|      run: |
47|47|        echo "Build User: $KBUILD_BUILD_USER"
48|48|        echo "Build Host: $KBUILD_BUILD_HOST"
49|49|        echo "DATE=$(date +%Y-%m-%d-%H-%M-%S)" >> $GITHUB_ENV
50|50|        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android10-release
51|51|        wget https://android.googlesource.com/platform//prebuilts/clang/host/linux-x86/+archive/3857008389202edac32d57008bb8c99d2c957f9d/clang-r383902.tar.gz
52|52|        mkdir clang
53|53|        tar -xzf clang-r383902.tar.gz -C clang/
54|54|        rm clang-r383902.tar.gz
55|55|        echo "$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/aarch64-linux-android-4.9/bin:/usr/bin:/bin" >> $GITHUB_PATH
56|56|        sed -i -E 's/\bpython2\b ?//g; s/  +/ /g' package
57|57|        bash package
