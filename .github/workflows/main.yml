253|253|
254|254|    - name: Build Kernel + Modules
255|255|      run: |
256|256|        make CC=clang ARCH=arm64 O=~/out -j$(nproc) \
257|257|          HEADER_ARCH=arm64 \
258|258|          SUBARCH=arm64 \
259|259|          LD=ld.lld \
260|260|          AR=llvm-ar \
261|261|          NM=llvm-nm \
262|262|          STRIP=llvm-strip \
263|263|          READELF=llvm-readelf \
264|264|          CROSS_COMPILE=aarch64-linux-android- \
265|265|          CLANG_TRIPLE=aarch64-linux-gnu-
266|266|
267|267|    - name: Verify Modules
268|268|      run: |
269|269|        echo "=== All .ko files ==="
270|270|        find ~/out -name "*.ko" | sort
271|271|        echo ""
272|272|        echo "=== Critical modules check ==="
273|273|        for mod in ath9k_htc.ko ath9k_hw.ko ath9k_common.ko 8188eu.ko nf_tables.ko; do
274|274|          FOUND=$(find ~/out -name "$mod" 2>/dev/null)
275|275|          if [ -n "$FOUND" ]; then
276|276|            echo "OK: $FOUND"
277|277|          else
278|278|            echo "MISSING: $mod"
279|279|          fi
280|280|        done
281|281|
282|282|    - name: Download Firmware
283|283|      run: |
284|284|        mkdir -p /tmp/nh-firmware
285|285|        wget -q "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/htc_9271.fw" -O /tmp/nh-firmware/htc_9271.fw 2>/dev/null || echo "FW_DL1_FAIL"
286|286|        wget -q "https://raw.githubusercontent.com/TI-OpenLink/firmware/firmware/htc_9271-1.4.0.fw" -O /tmp/nh-firmware/htc_9271.fw 2>/dev/null || echo "FW_DL2_FAIL"
287|287|        wget -q "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtlwifi/rtl8xxxu_fw.bin" -O /tmp/nh-firmware/rtl8xxxu_fw.bin 2>/dev/null || echo "FW_DL3_FAIL"
288|288|        wget -q "https://gitlab.com/linux-firmware/linux-firmware/-/raw/main/rtlwifi/rtl8188eu_fw.bin" -O /tmp/nh-firmware/rtl8188eu_fw.bin 2>/dev/null || echo "FW_DL4_FAIL"
289|289|        ls -la /tmp/nh-firmware/ 2>/dev/null || echo "NO_FW_DOWNLOADED"
290|290|
291|291|    - name: AnyKernel3 Packaging
292|292|      run: |
293|293|        ANYKERNEL=$GITHUB_WORKSPACE/kali-nethunter-kernel/anykernel3
294|294|        ZIPNAME="NH-RMX2185-${{ env.DATE }}"
295|295|        mv ~/out/arch/arm64/boot/Image.gz $ANYKERNEL
296|296|        mkdir -p $ANYKERNEL/modules/system/lib/modules
297|297|        find ~/out -name "*.ko" -exec cp {} $ANYKERNEL/modules/system/lib/modules/ \;
298|298|        if [ -f /tmp/nh-firmware/htc_9271.fw ]; then
299|299|          mkdir -p $ANYKERNEL/modules/system/lib/firmware/ath9k_htc
300|300|          cp /tmp/nh-firmware/htc_9271.fw $ANYKERNEL/modules/system/lib/firmware/ath9k_htc/
301|301|        fi
302|302|        if [ -f /tmp/nh-firmware/rtl8188eu_fw.bin ]; then
303|303|          mkdir -p $ANYKERNEL/modules/system/lib/firmware/rtlwifi
304|304|          cp /tmp/nh-firmware/rtl8188eu_fw.bin $ANYKERNEL/modules/system/lib/firmware/rtlwifi/
305|305|        fi
306|306|        cat > $ANYKERNEL/modules/system/etc/init.d/99nethunter_modules << 'SCRIPT'
307|307|        #!/system/bin/sh
308|308|        MODDIR=/system/lib/modules
309|309|        insmod $MODDIR/ath9k_hw.ko 2>/dev/null
310|310|        insmod $MODDIR/ath9k_common.ko 2>/dev/null
311|311|        insmod $MODDIR/ath9k_htc.ko ps_enable=0 2>/dev/null
312|312|        insmod $MODDIR/8188eu.ko 2>/dev/null
313|313|        insmod $MODDIR/nf_tables.ko 2>/dev/null
314|314|        SCRIPT
315|315|        chmod +x $ANYKERNEL/modules/system/etc/init.d/99nethunter_modules
316|316|        cd $ANYKERNEL
317|317|        zip -r9 ${ZIPNAME}.zip *
318|318|
319|319|    - name: Upload to Release
320|320|      uses: softprops/action-gh-release@v2
321|321|      with:
322|322|        files: kali-nethunter-kernel/anykernel3/*.zip
323|323|        name: NH-RMX2185-${{ env.DATE }}-${{ github.run_id }}
324|324|        tag_name: ${{ github.run_id }}
325|325|        token: ${{ secrets.MY_TOKEN }}
326|326|        body: |
327|327|          NetHunter Kernel for RMX2185 (MT6765)
328|328|          Base: nethunter_defconfig + NetHunter Config
329|329|          Modules: ath9k_htc, 8188eu, nf_tables + nftables suite
330|330|          Features: AP + Monitor + VIF (8188eu), PM fix (ath9k_htc)
331|331|          Firmware: htc_9271.fw + rtl8188eu_fw.bin included
332|332|          Build: ${{ env.DATE }}
333|333|
