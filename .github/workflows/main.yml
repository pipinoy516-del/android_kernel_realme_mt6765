66|66|
67|67|    - name: Prepare nethunter_defconfig + NetHunter Config
68|68|      run: |
69|69|        make CC=clang ARCH=arm64 O=~/out nethunter_defconfig
70|70|        cd ~/out
71|71|        CONFIG=${GITHUB_WORKSPACE}/scripts/config
72|72|
73|73|        # === Disable old rtl8xxxu (STATION-only, no VIF) ===
74|74|        ${CONFIG} --disable CONFIG_RTL8XXXU
75|75|
76|76|        # === TL-WN725N v3: Enable 8188eu (full AP+Monitor+VIF) ===
